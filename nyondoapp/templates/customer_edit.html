<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Customer — NYONDO Hardware</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Georgia, serif;
      }
      body {
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
      h2 {
        font-size: 20px;
        margin-bottom: 20px;
        border-left: 4px solid #f59e0b;
        padding-left: 10px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #374151;
      }
      input,
      select {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: #f59e0b;
      }
      .btn-save {
        background: #f59e0b;
        color: #1f2937;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }
      .btn-save:hover {
        background: #1f2937;
        color: #f59e0b;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #6b7280;
        font-size: 13px;
        text-decoration: none;
      }
      .back:hover {
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>✏ Edit Customer</h2>
      <form method="POST">
        {% csrf_token %}

        <label>Full Name</label>
        <input type="text" name="full_name" value="{{ customer.full_name }}" />

        <label>NIN (National Identification Number)</label>
        <input type="text" name="NIN" value="{{ customer.NIN }}" />

        <label>Phone Number</label>
        <input type="text" name="phone" value="{{ customer.phone }}" />

        <label>Employer / Workplace</label>
        <input type="text" name="employer" value="{{ customer.employer }}" />

        <label>Physical Address</label>
        <input type="text" name="address" value="{{ customer.address }}" />

        <label>Preferred Product</label>
        <select name="preferred_product">
          <option
            value="cement_cem2"
            {%
            if
            customer.preferred_product=""
            ="cement_cem2"
            %}selected{%
            endif
            %}
          >
            Cement CEM II N
          </option>
          <option
            value="cement_cem3"
            {%
            if
            customer.preferred_product=""
            ="cement_cem3"
            %}selected{%
            endif
            %}
          >
            Cement CEM III N
          </option>
          <option
            value="iron_bar_10"
            {%
            if
            customer.preferred_product=""
            ="iron_bar_10"
            %}selected{%
            endif
            %}
          >
            Iron Bar 10mm
          </option>
          <option
            value="iron_bar_12"
            {%
            if
            customer.preferred_product=""
            ="iron_bar_12"
            %}selected{%
            endif
            %}
          >
            Iron Bar 12mm
          </option>
          <option
            value="iron_bar_16"
            {%
            if
            customer.preferred_product=""
            ="iron_bar_16"
            %}selected{%
            endif
            %}
          >
            Iron Bar 16mm
          </option>
          <option
            value="iron_sheet_26"
            {%
            if
            customer.preferred_product=""
            ="iron_sheet_26"
            %}selected{%
            endif
            %}
          >
            Iron Sheets 26G
          </option>
          <option
            value="iron_sheet_28"
            {%
            if
            customer.preferred_product=""
            ="iron_sheet_28"
            %}selected{%
            endif
            %}
          >
            Iron Sheets 28G
          </option>
          <option
            value="iron_sheet_30"
            {%
            if
            customer.preferred_product=""
            ="iron_sheet_30"
            %}selected{%
            endif
            %}
          >
            Iron Sheets 30G
          </option>
        </select>

        <button class="btn-save" type="submit">Save Changes</button>
      </form>
      <a class="back" href="/customer_registration/">← Back to Customers</a>
    </div>
  </body>
</html>
