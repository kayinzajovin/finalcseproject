<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — NYONDO Hardware</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-+0r6rrwMZceTYFygJXRL7Hhdhsq6TOcKPEbb9Rwzc2b4EkJmO+iSWoZVata3u0G3UcNYI9dZe4UfgZ7HU5a3HQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Georgia, serif;
      }

      body {
        background: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: #ffffff;
        color: #1f2937;
        width: 100%;
        max-width: 420px;
        border-radius: 14px;
        padding: 45px 40px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .card-logo {
        width: 60px;
        height: 60px;
        background: #f59e0b;
        color: #1f2937;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
        margin: 0 auto 15px;
      }

      .login-card h2 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 5px;
      }

      .login-card p.sub {
        text-align: center;
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 30px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #1f2937;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 20px;
        outline: none;
      }

      input:focus {
        border-color: #f59e0b;
      }

      .role-select {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .role-btn {
        flex: 1;
        padding: 10px 6px;
        border: 2px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #6b7280;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
      }
      .role-btn.selected {
        border-color: #f59e0b;
        background: #fff7ed;
        color: #1f2937;
      }

      /* error message box */
      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 18px;
        font-size: 13px;
        font-weight: bold;
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background: #f59e0b;
        color: #1f2937;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .btn-login:hover {
        opacity: 0.9;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
      }

      .back-link a {
        color: #f59e0b;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="card-logo">N</div>
      <h2>NYONDO HARDWARE</h2>
      <p class="sub">Sign in to manage stock & sales</p>

      <!-- real POST form with csrf token -->
      <form id="login-form" method="POST" action="/login/">
        {% csrf_token %}

        <!-- hidden input stores the selected role -->
        <input type="hidden" name="role" id="role-input" value="admin" />

        <label>Select Your Role</label>
        <div class="role-select">
          <div class="role-btn selected" onclick="selectRole(this, 'admin')">
            🔑 Admin
          </div>
          <div class="role-btn" onclick="selectRole(this, 'salesperson')">
            <i class="fa-solid fa-coins"></i> Sales
          </div>
          <div class="role-btn" onclick="selectRole(this, 'stockmanager')">
            <i class="fa-solid fa-box"></i> Stock
          </div>
        </div>

        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
        />

        <!-- show error message if login fails -->
        {% if messages %} {% for message in messages %}
        <div class="alert-error"><i class="fa-solid fa-circle-xmark"></i> {{ message }}</div>
        {% endfor %} {% endif %}

        <button class="btn-login" type="submit">LOGIN</button>
      </form>

      <div class="back-link">
        <a onclick="window.location.href = '/'">← Back to Home</a>
      </div>
    </div>

    <script>
      /* update hidden role input when a role button is clicked */
      function selectRole(el, role) {
        document.querySelectorAll(".role-btn").forEach(function (b) {
          b.classList.remove("selected");
        });
        el.classList.add("selected");
        document.getElementById("role-input").value = role;
      }
    </script>
  </body>
</html>
