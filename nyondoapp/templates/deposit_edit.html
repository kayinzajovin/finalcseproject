<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Deposit — NYONDO Hardware</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Georgia, serif;
      }
      body {
        background: #f4f6f8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: #fff;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
      }
      h2 {
        font-size: 20px;
        margin-bottom: 20px;
        border-left: 4px solid #f59e0b;
        padding-left: 10px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #374151;
      }
      select {
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 16px;
        outline: none;
      }
      select:focus {
        border-color: #f59e0b;
      }
      .info {
        background: #fff7ed;
        border-left: 4px solid #f59e0b;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        color: #374151;
        margin-bottom: 20px;
      }
      .info p {
        margin-bottom: 6px;
      }
      .info span {
        font-weight: bold;
      }
      .btn-save {
        background: #f59e0b;
        color: #1f2937;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
      }
      .btn-save:hover {
        background: #1f2937;
        color: #f59e0b;
      }
      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #6b7280;
        font-size: 13px;
        text-decoration: none;
      }
      .back:hover {
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>✏ Edit Deposit Status</h2>

      <!-- show deposit details for reference -->
      <div class="info">
        <p>Customer: <span>{{ deposit.customer.full_name }}</span></p>
        <p>Product: <span>{{ deposit.product.name }}</span></p>
        <p>Amount: <span>UGX {{ deposit.amount_deposited }}</span></p>
        <p>Units: <span>{{ deposit.units_equivalent }}</span></p>
        <p>Date: <span>{{ deposit.date|date:"d M Y" }}</span></p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <label>Update Status</label>
        <select name="status">
          <option
            value="active"
            {%
            if
            deposit.status=""
            ="active"
            %}selected{%
            endif
            %}
          >
            Active
          </option>
          <option
            value="ready_pickup"
            {%
            if
            deposit.status=""
            ="ready_pickup"
            %}selected{%
            endif
            %}
          >
            Ready for Pickup
          </option>
          <option
            value="collected"
            {%
            if
            deposit.status=""
            ="collected"
            %}selected{%
            endif
            %}
          >
            Collected
          </option>
        </select>

        <button class="btn-save" type="submit">Save Status</button>
      </form>
      <a class="back" href="/customer_deposit/">← Back to Deposits</a>
    </div>
  </body>
</html>
