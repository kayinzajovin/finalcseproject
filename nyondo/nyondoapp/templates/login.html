<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — NYONDO Hardware</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-+0r6rrwMZceTYFygJXRL7Hhdhsq6TOcKPEbb9Rwzc2b4EkJmO+iSWoZVata3u0G3UcNYI9dZe4UfgZ7HU5a3HQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Georgia, serif;
      }

      body {
        background: #1f2937;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: #ffffff;
        color: #1f2937;
        width: 100%;
        max-width: 420px;
        border-radius: 14px;
        padding: 45px 40px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      .card-logo {
        width: 60px;
        height: 60px;
        background: #f59e0b;
        color: #1f2937;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
        margin: 0 auto 15px;
      }

      .login-card h2 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 5px;
      }

      .login-card p.sub {
        text-align: center;
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 30px;
      }

      /* wraps each label + input + error message */
      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #1f2937;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #f59e0b;
      }

      /* red border when field has an error */
      .field-error {
        border-color: #dc2626 !important;
      }

      /* small red text shown directly below the input */
      .error-msg {
        color: #dc2626;
        font-size: 12px;
        margin-top: 5px;
        display: block;
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background: #f59e0b;
        color: #1f2937;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 8px;
      }

      .btn-login:hover {
        opacity: 0.9;
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
      }

      .back-link a {
        color: #f59e0b;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="card-logo">N</div>
      <h2>NYONDO HARDWARE</h2>
      <p class="sub">Sign in to manage stock &amp; sales</p>

      <form method="POST" action="/login/">
        {% csrf_token %}

        <!-- USERNAME FIELD -->
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            value="{{ request.POST.username|default:'' }}"
            class="{% if errors.username %}field-error{% endif %}"
          />
          {% if errors.username %}
            <span class="error-msg">
              <i class="fa-solid fa-triangle-exclamation"></i> {{ errors.username }}
            </span>
          {% endif %}
        </div>

        <!-- PASSWORD FIELD -->
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            class="{% if errors.password %}field-error{% endif %}"
          />
          {% if errors.password %}
            <span class="error-msg">
              <i class="fa-solid fa-triangle-exclamation"></i> {{ errors.password }}
            </span>
          {% endif %}
        </div>

        <!-- general error shown when username or password is wrong -->
        {% if errors.general %}
  <span class="error-msg" style="margin-bottom:14px;">
    <i class="fa-solid fa-triangle-exclamation"></i> {{ errors.general }}
  </span>
{% endif %}

        <button class="btn-login" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i> LOGIN
        </button>
      </form>

      <div class="back-link">
        <a onclick="window.location.href = '/'">← Back to Home</a>
      </div>
    </div>
  </body>
</html>
